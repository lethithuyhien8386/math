name: Build and smoke-test Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (NO obsolete tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static checks, unit tests, assemble APK
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK metadata and cryptographic signature
        run: bash scripts/verify-apk.sh
      - name: Store installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoMathSolver-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: AutoMathSolver-debug-apk
          path: app/build/outputs/apk/debug
      - name: Enable KVM access on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and actually LAUNCH app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          script: bash scripts/emulator-smoke.sh
